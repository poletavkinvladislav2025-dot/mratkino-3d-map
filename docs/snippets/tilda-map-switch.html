<!-- Вставить ВМЕСТО отдельного iframe 3D в T123. Блок Яндекс.Карты оставить. -->
<div id="vb-map-link-note" role="status">Подключаем переключатель карт…</div>
<style>
#vb-map-modes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;font-family:TildaSans,Arial,sans-serif}
#vb-map-modes button{min-height:44px;padding:10px 18px;border:1px solid #d7e2d9;border-radius:24px;background:#fff;color:#214e3b;font:600 15px TildaSans,Arial,sans-serif;cursor:pointer}
#vb-map-modes button[aria-pressed="true"]{background:#214e3b;color:#fff;border-color:#214e3b}
#vb-map-modes button:focus-visible{outline:3px solid #c48352;outline-offset:3px}
#vb-map-link-note{font:14px/1.5 TildaSans,Arial,sans-serif;color:#365344}
#vb-map-link-note:empty{display:none}
.vb-map-unified-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;z-index:100;background:#f4f7f2}
.vb-map-unified-frame[hidden]{display:none!important}
.vb-map-unified-3d>:not(.vb-map-unified-frame){visibility:hidden!important;pointer-events:none!important}
@media(max-width:480px){#vb-map-modes button{flex:1;padding:10px 12px}}
</style>
<script>
(function(){
  'use strict';
  var note=document.getElementById('vb-map-link-note');
  var sourceRecord=note.closest('.t-rec'),attempts=0;
  function init(){
    var host=document.querySelector('.vb-t1__map');
    if(!host){
      if(++attempts<40){setTimeout(init,250);return;}
      note.textContent='Не найден блок обычной карты. Оставьте его на странице перед этим T123.';
      return;
    }
    if(document.getElementById('vb-map-modes')){note.remove();return;}
    var origin='https://poletavkinvladislav2025-dot.github.io';
    var url=new URL('/mratkino-3d-map/preview/landscape/',origin);
    url.searchParams.set('place','all');
    url.searchParams.set('parentOrigin',location.origin);
    var bar=document.createElement('div');
    bar.id='vb-map-modes';bar.setAttribute('role','group');
    bar.setAttribute('aria-label','Режим карты');
    var normal=document.createElement('button'),three=document.createElement('button');
    normal.type=three.type='button';
    normal.textContent='Обычная карта';three.textContent='3D-карта';
    bar.append(normal,three);
    host.before(bar);bar.after(note);
    var children=Array.from(host.children).map(function(el){
      return {el:el,inert:el.inert,aria:el.getAttribute('aria-hidden')};
    });
    var frame=document.createElement('iframe');
    frame.className='vb-map-unified-frame';frame.title='3D-карта Visit Beloretsk';
    frame.allow='fullscreen';frame.allowFullscreen=true;frame.hidden=true;
    host.append(frame);
    var active=false,ready=false,loaded=false,sequence=0,slowTimer;
    function send(command){
      if(ready)frame.contentWindow.postMessage({type:'vb3d.command',version:1,
        id:'tilda-'+(++sequence),command:command,payload:{}},origin);
    }
    function sync(){
      send(active&&!document.hidden?'resume':'suspend');
      if(active&&!document.hidden)send('resize');
    }
    function show(is3d){
      if(!is3d)send('suspend');
      active=is3d;
      host.classList.toggle('vb-map-unified-3d',active);
      frame.hidden=!active;
      children.forEach(function(item){
        item.el.inert=active||item.inert;
        if(active)item.el.setAttribute('aria-hidden','true');
        else if(item.aria===null)item.el.removeAttribute('aria-hidden');
        else item.el.setAttribute('aria-hidden',item.aria);
      });
      normal.setAttribute('aria-pressed',String(!active));
      three.setAttribute('aria-pressed',String(active));
      if(active&&!loaded){
        loaded=true;note.textContent='Загружаем 3D-карту…';
        slowTimer=setTimeout(function(){
          if(!ready)note.textContent='Загрузка занимает больше времени. Можно вернуться к обычной карте.';
        },25000);
        frame.src=url.href;
      }
      requestAnimationFrame(function(){
        sync();
        if(!active)window.dispatchEvent(new Event('resize'));
      });
    }
    window.addEventListener('message',function(e){
      if(e.origin!==origin||e.source!==frame.contentWindow)return;
      var m=e.data;
      if(!m||m.type!=='vb3d.event'||m.version!==1)return;
      if(m.event==='ready'){
        ready=true;clearTimeout(slowTimer);note.textContent='';sync();
      }
      if(m.event==='error'&&m.payload&&m.payload.code==='WEBGL_UNAVAILABLE'){
        clearTimeout(slowTimer);show(false);normal.focus();
        note.textContent='3D недоступна в этом браузере. Открыта обычная карта.';
      }
    });
    normal.addEventListener('click',function(){show(false);});
    three.addEventListener('click',function(){show(true);});
    var root=host.closest('.vb-t1');
    if(root)root.querySelectorAll('.vb-t1__tab').forEach(function(button){
      button.addEventListener('click',function(){show(false);},true);
    });
    window.addEventListener('hashchange',function(){
      if(location.hash==='#map'||location.hash==='#map-stamps')show(false);
    });
    document.addEventListener('visibilitychange',sync);
    if(window.ResizeObserver)new ResizeObserver(function(){if(active)send('resize');}).observe(host);
    note.textContent='';show(false);
    if(sourceRecord&&!sourceRecord.contains(host))sourceRecord.style.display='none';
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
  else init();
})();
</script>
